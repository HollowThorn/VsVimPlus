# This is a basic workflow to help you get started with Actions

name: VsVim CI

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "master", "main", "dev/gha" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows-build:
    name: Windows Build and Test
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v3

      - name: Build
        shell: powershell
        run: Scripts\Build.ps1 -ci -config Debug -build 

      - name: Test
        shell: powershell
        run: Scripts\Build.ps1 -ci -config Debug -test

      - name: Test Extra
        shell: powershell
        run: Scripts\Build.ps1 -ci -config Debug -testExtra

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: Binaries\Logs

  # This job only runs when a version tag (e.g. "v2.12") is pushed. It builds a Release VSIX
  # and attaches it to a GitHub Release for that tag, so there's a permanent, shareable
  # download link for that version.
  windows-publish:
    name: Publish VSIX
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build VSIX
        shell: powershell
        run: Scripts\Build.ps1 -ci -build -updateVsixVersion -config Release

      - name: Upload VSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vsix
          path: Binaries\Deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: Binaries\Deploy\Release\2022\VsVim.vsix
